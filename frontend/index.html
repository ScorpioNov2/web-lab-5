<!doctype html>
<html lang="ru" data-theme="christmas">
	<head>
		<meta charset="utf-8" />
		<title>Управление Студентами</title>
		<base href="./" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/jpeg" href="/assets/cats.jpg" />

		<!-- Initial loading -->
		<style>
			#initial-loading {
				position: fixed;
				inset: 0;
				z-index: 99999;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 16px;
				background: #ffffff;
				font-family: Arial, sans-serif;
				color: #334155;
			}

			.initial-spinner {
				width: 48px;
				height: 48px;
				border: 5px solid #e2e8f0;
				border-top-color: #2563eb;
				border-radius: 50%;
				animation: initial-spin 0.8s linear infinite;
			}

			@keyframes initial-spin {
				to {
					transform: rotate(360deg);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.initial-spinner {
					animation: none;
				}
			}
		</style>

		<link rel="stylesheet" href="/src/styles.scss" />
	</head>

	<body>
		<div id="initial-loading" role="status" aria-live="polite">
			<div class="initial-spinner" aria-hidden="true"></div>
			<span>Загрузка...</span>
		</div>

		<app-root></app-root>

		<script>
			window.addEventListener('beforeunload', function () {
				if (!document.getElementById('initial-loading')) {
					var loader = document.createElement('div');
					loader.id = 'initial-loading';
					loader.innerHTML = '<div class="initial-spinner"></div><span>Загрузка...</span>';
					document.body.appendChild(loader);
				}
			});
		</script>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>

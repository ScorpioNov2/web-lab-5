<section class="toolbar-section">
	<div class="search-box">
		<input
			type="text"
			placeholder="Поиск..."
			aria-label="Поиск"
			[value]="criteria().searchKeyword"
			(input)="onSearch($event)"
		/>
	</div>
	<div
		class="action-buttons"
		[attr.title]="
			auth.canManageStudents() ? null : 'Изменять данные может только администратор'
		"
	>
		<button
			type="button"
			class="btn btn-success"
			[disabled]="!auth.canManageStudents()"
			(click)="openAdd()"
		>
			Добавление
		</button>
		<button
			type="button"
			class="btn btn-primary"
			[disabled]="!auth.canManageStudents() || focusedIsuId() === null"
			(click)="editSelected()"
		>
			Редактирование
		</button>
		<button
			type="button"
			class="btn btn-danger"
			[disabled]="!auth.canManageStudents() || focusedIsuId() === null"
			(click)="deleteSelected()"
		>
			Удаление
		</button>
	</div>
</section>

<section class="status-section">
	<span class="badge-info">Всего: {{ totalStudents() }} студентов</span>
</section>

<section #tableContainer class="table-container" [class.is-loading]="loading.isLoading()">
	<app-loading-overlay />
	@if (error(); as failure) {
		<app-error-state [status]="failure.status" [message]="failure.message" (retry)="reload()" />
	} @else if (students().length === 0) {
		<div class="empty-state">
			<img src="assets/app/empty-box.png" alt="No data" class="empty-img" />
			<p class="empty-text">Список пуст или результаты не найдены.</p>
		</div>
	} @else {
		<app-student-table
			[students]="students()"
			[sortField]="criteria().sortField"
			[sortDirection]="criteria().sortDirection"
			[focusedIsuId]="focusedIsuId()"
			(sort)="onSort($event)"
			(rowSelect)="focusedIsuId.set($event)"
			(rowOpen)="openDetails($event)"
			(rowHover)="prefetch($event)"
		/>
	}
</section>

<app-pagination
	[currentPage]="criteria().pageNumber"
	[totalPages]="totalPages()"
	(pageChange)="onPageChange($event)"
/>

@if (deleteState(); as state) {
	<app-student-modal
		[state]="state"
		(closed)="closeDeletePopup()"
		(remove)="deleteStudent($event)"
		(switchToEdit)="editFromDeletePopup($event)"
	/>
}

<!-- popups of the child routes: /students/new, /students/:id, /students/:id/edit, /profile -->
<router-outlet />

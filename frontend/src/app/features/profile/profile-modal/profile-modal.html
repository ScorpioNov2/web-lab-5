<app-modal-shell title="Профиль пользователя" (closed)="close()">
	@if (user(); as user) {
		<div class="profile-head">
			<span class="profile-avatar" aria-hidden="true">
				<svg
					viewBox="0 0 24 24"
					width="34"
					height="34"
					fill="none"
					stroke="currentColor"
					stroke-width="1.7"
					stroke-linecap="round"
					stroke-linejoin="round"
				>
					<circle cx="12" cy="8" r="4" />
					<path d="M4.5 20.5c0-3.9 3.4-6.5 7.5-6.5s7.5 2.6 7.5 6.5" />
				</svg>
			</span>
			<div class="profile-name">{{ user.fullName || user.username }}</div>
			<span class="role-badge" [class.role-admin]="auth.role() === 'ADMIN'">{{
				roleLabel()
			}}</span>
		</div>

		<dl class="profile-data">
			<dt>Имя пользователя</dt>
			<dd>{{ user.username }}</dd>
			<dt>Электронная почта</dt>
			<dd>{{ user.email }}</dd>
		</dl>

		<h3 class="rights-title">Что вам доступно</h3>
		<ul class="rights-list">
			<li class="allowed">Просмотр списка студентов и их карточек</li>
			<li
				[class.allowed]="auth.canManageStudents()"
				[class.denied]="!auth.canManageStudents()"
			>
				Добавление, редактирование и удаление студентов
			</li>
		</ul>
	}
</app-modal-shell>

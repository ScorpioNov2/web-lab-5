<section class="error-state" role="alert">
	@if (status() > 0) {
		<div class="error-code">{{ status() }}</div>
	}
	<h2 class="error-title">{{ view().title }}</h2>
	<p class="error-hint">{{ message() || view().hint }}</p>
	<div class="error-actions">
		@if (retryable() && view().canRetry) {
			<button type="button" class="btn btn-primary" (click)="retry.emit()">Повторить</button>
		}
		<a class="btn btn-secondary" [routerLink]="view().action.url">{{ view().action.label }}</a>
	</div>
</section>
